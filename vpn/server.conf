port 1194
proto udp
dev tun0
# Kernel DCO cannot be managed from an unprivileged container (peer stats calls fail and
# force session restarts every status interval), so use the userspace tun data channel
disable-dco
ca /etc/openvpn/easy-rsa/pki/ca.crt
cert /etc/openvpn/easy-rsa/pki/issued/server.crt
key /etc/openvpn/easy-rsa/pki/private/server.key
dh none
tls-crypt /etc/openvpn/easy-rsa/pki/tc.key
topology subnet
# server subnet, client routes and session tokens come from .env (see scripts/start.sh)
verify-client-cert none

# TLS 1.3 only (ECDHE + AEAD), AEAD-only data channel
tls-version-min 1.3
tls-groups X25519:prime256v1:secp384r1
data-ciphers AES-256-GCM:CHACHA20-POLY1305

# Stay connected: detect dead peers quickly, follow clients across networks,
# rotate data keys hourly (re-auth uses the session token, so no OTP prompt)
keepalive 10 60
float
reneg-sec 3600

# LDAP password + OTP, both checked by the PAM stack in pam.d/openvpn
# (the plugin splits the static-challenge response into PASSWORD and OTP)
plugin /usr/lib/openvpn/plugins/openvpn-plugin-auth-pam.so "openvpn login USERNAME password PASSWORD pin OTP"

user nobody
group nogroup
persist-tun
status /var/log/openvpn/openvpn-status.log
verb 3
explicit-exit-notify 1
script-security 2
username-as-common-name
duplicate-cn
